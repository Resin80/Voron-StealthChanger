# This file contains common pin mappings for the BIGTREETECH EBBT36 Gen2 V1.0.
# To use this config, the firmware should be compiled for the 
# STM32G0B1 with "8 MHz crystal" and "USB (on PA11/PA12)".

# change the mcu section name to the tool board you are configuring:
# EBBT1, EBBT1, etc.
[mcu EBBT1]

canbus_uuid:803c13ed3a68


# change the accelerometer section name to the tool you are configuring:
# T0, T1, etc.
[lis2dw T1]
cs_pin: EBBT1:PB1
spi_software_sclk_pin: EBBT1:PB10
spi_software_mosi_pin: EBBT1:PB11
spi_software_miso_pin: EBBT1:PB2
axes_map: x,y,z

# change to the extruder section you are configuring:
# extruder, extruder1, etc.
[extruder1] # Orbiter2.5 with CHCB-V Hotend
step_pin: EBBT1:PB14
dir_pin: !EBBT1:PA8
enable_pin: !EBBT1:PB6
heater_pin: EBBT1:PB4
sensor_pin: EBBT1:PA3
pullup_resistor: 2200
microsteps: 16
rotation_distance: 45.190
gear_ratio: 50:10	
full_steps_per_rotation: 200
nozzle_diameter: 0.400
filament_diameter: 1.750
min_temp: 0
max_temp: 290
pressure_advance: 0.03
sensor_type: ATC Semitec 104NT-4-R025H42G
#pullup_resistor: 2000
max_extrude_cross_section: 5
max_extrude_only_distance: 101
control: pid
pid_Kp: 22.314 # Reduce gain to make response gentler
pid_Ki: 1.907  # Reduce accumulated correction
pid_Kd: 65.268     # Increase damping to resist sharp swings

# change the tmc2209 section name to match the extruder you are configuring:
# extruder, extruder1, etc.
[tmc2209 extruder] # Orbiter2.5
uart_pin: EBBT1:PB3
run_current: 0.65
stealthchop_threshold: 0

# change the heater_fan section name to match the tool you are configuring:
# T0_hotend_fan, T1_hotend_fan, etc.
[heater_fan T1_hotend_fan]
pin: EBBT1:PD2
heater: extruder1 # change to match the extruder you are configuring: extruder, extruder1, etc.
heater_temp: 50.0
tachometer_pin: EBBT1:PA4
tachometer_ppr: 2

[multi_pin T1_multipin]
pins: EBBT1:PD3, EBBT1:PA5

# change the fan_generic section name to the tool you are configuring:
# T0_partfan, T1_partfan, etc.
[fan_generic T1_part_fan]
pin: multi_pin:T1_multipin

# change the tool section name to the tool you are configuring:
# T0, T1, etc.
[tool T1]
tool_number: 1 # change to the index of the tool. 0, 1, 2, etc.
extruder: extruder1 # change to match the extruder you are configuring: extruder, extruder1, etc.
fan: T1_part_fan
detection_pin: ^EBBT1:PB8
params_park_x: 87.10 # The absolute X-position of the tool in its dock.
params_park_y: 5.80 # The absolute Y-position of the tool in its dock.
params_park_z: 249.60 # The absolute Z-position where the tool and shuttle mate in the dock, determined when the TAP (or Z-probe) triggers.
gcode_x_offset: -0.180
gcode_y_offset: 0.900
gcode_z_offset: -0.998


# Results from input shaper
# Uncomment the following lines if you have input shaper results for this tool
params_input_shaper_freq_x: 123.4
params_input_shaper_type_x: '2hump_ei'
params_input_shaper_damping_ratio_x: 0.150
params_input_shaper_freq_y: 55.6
params_input_shaper_type_y: '3hump_ei'
params_input_shaper_damping_ratio_y: 0.081

# change the neopixel section name to the tool you are configuring:
# T0, T1, etc.
[neopixel T1]
pin: EBBT1:PC7
color_order: GRBW
chain_count: 23
initial_RED: 0.5
initial_GREEN: 0.0
initial_BLUE: 0.5
initial_WHITE: 0.0

# change the gcode_macro section name to the tool you are configuring:
# T0, T1, etc.
[gcode_macro T1]
variable_active: 0 # Must be zero.
variable_color: "" # Leave empty
gcode:
    SELECT_TOOL T=1 # change to the index of the tool. 0, 1, 2, etc.

#####################################################################
#   Filament Sensor
#####################################################################
[filament_switch_sensor filament_sensor T1]
switch_pin: EBBT1:PA15
pause_on_runout: True    

[temperature_sensor EBB36_Gen2 T1]
sensor_type: temperature_mcu
sensor_mcu: EBBCan