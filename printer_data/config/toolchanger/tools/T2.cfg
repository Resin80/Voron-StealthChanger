# This file contains common pin mappings for the BIGTREETECH EBBT36 Gen2 V1.0.
# To use this config, the firmware should be compiled for the 
# STM32G0B1 with "8 MHz crystal" and "USB (on PA11/PA12)".

# change the mcu section name to the tool board you are configuring:
# EBBT2, EBBT2, etc.
[mcu EBBT2]

canbus_uuid:26d7c6c89efe


# change the accelerometer section name to the tool you are configuring:
# T0, T1, etc.
[lis2dw T2]
cs_pin: EBBT2:PB1
spi_software_sclk_pin: EBBT2:PB10
spi_software_mosi_pin: EBBT2:PB11
spi_software_miso_pin: EBBT2:PB2
axes_map: x,y,z

# change to the extruder section you are configuring:
# extruder, extruder1, etc.
[extruder2] # Orbiter2.5 with CHCB-V Hotend
step_pin: EBBT2:PB14
dir_pin: !EBBT2:PA8
enable_pin: !EBBT2:PB6
heater_pin: EBBT2:PB4
sensor_pin: EBBT2:PA3
pullup_resistor: 2200
microsteps: 16
rotation_distance: 44.675
gear_ratio: 50:10	
full_steps_per_rotation: 200
nozzle_diameter: 0.400
filament_diameter: 1.750
min_temp: 0
max_temp: 290
pressure_advance: 0.03
sensor_type: ATC Semitec 104NT-4-R025H42G
#pullup_resistor: 2000
max_extrude_cross_section: 5
max_extrude_only_distance: 101
control: pid
pid_Kp: 18.650 # Reduce gain to make response gentler
pid_Ki: 1.282  # Reduce accumulated correction
pid_Kd: 67.837     # Increase damping to resist sharp swings

# change the tmc2209 section name to match the extruder you are configuring:
# extruder, extruder1, etc.
[tmc2209 extruder] # Orbiter2.5
uart_pin: EBBT2:PB3
run_current: 0.60
stealthchop_threshold: 0

# change the heater_fan section name to match the tool you are configuring:
# T0_hotend_fan, T1_hotend_fan, etc.
[heater_fan T2_hotend_fan]
pin: EBBT2:PD2
heater: extruder2 # change to match the extruder you are configuring: extruder, extruder1, etc.
heater_temp: 50.0
tachometer_pin: EBBT2:PA4
tachometer_ppr: 2

[multi_pin T2_multipin]
pins: EBBT2:PD3, EBBT2:PA5

# change the fan_generic section name to the tool you are configuring:
# T0_partfan, T1_partfan, etc.
[fan_generic T2_part_fan]
pin: multi_pin:T2_multipin

# change the tool section name to the tool you are configuring:
# T0, T1, etc.
[tool T2]
tool_number: 2 # change to the index of the tool. 0, 1, 2, etc.
extruder: extruder2 # change to match the extruder you are configuring: extruder, extruder1, etc.
fan: T2_part_fan
detection_pin: ^EBBT2:PB8
params_park_x: 147.70 # The absolute X-position of the tool in its dock.
params_park_y: 5.40 # The absolute Y-position of the tool in its dock.
params_park_z: 249.00 # The absolute Z-position where the tool and shuttle mate in the dock, determined when the TAP (or Z-probe) triggers.
gcode_x_offset: -0.660
gcode_y_offset: 0.350
gcode_z_offset: -0.419

# Results from input shaper
# Uncomment the following lines if you have input shaper results for this tool
params_input_shaper_freq_x: 92.6
params_input_shaper_type_x: 'mzv'
params_input_shaper_damping_ratio_x: 0.17
params_input_shaper_freq_y: 27.8
params_input_shaper_type_y: 'mzv'
params_input_shaper_damping_ratio_y: 0.071

# change the neopixel section name to the tool you are configuring:
# T0, T1, etc.
[neopixel T2]
pin: EBBT2:PC7
color_order: GRBW
chain_count: 23
initial_RED: 0.5
initial_GREEN: 0.0
initial_BLUE: 0.5
initial_WHITE: 0.0

# change the gcode_macro section name to the tool you are configuring:
# T0, T1, etc.
[gcode_macro T2]
variable_active: 0 # Must be zero.
variable_color: "" # Leave empty
gcode:
    SELECT_TOOL T=2 # change to the index of the tool. 0, 1, 2, etc.

#####################################################################
#   Filament Sensor
#####################################################################
[filament_switch_sensor filament_sensor T2]
switch_pin: EBBT2:PA15
pause_on_runout: True    

[temperature_sensor EBB36 Tool 2 T2]
sensor_type: Generic 3950
sensor_pin: EBBT2:PA0
pullup_resistor: 2200